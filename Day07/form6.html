<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Health Details Form</h1>
    <fieldset>
        <legend>personal information</legend>
        <form action="">
            <label for="first">FULL NAME:</label>
            <input type="text" name="FULL NAME" id="first">
            <br>
            <br>
            <label for="birth">DATE OF BIRTH:</label>
            <input type="date" name="DATE OF BIRTH" id="birth" required>
            <br>
            <br>
           <label for="gender">gender:</label>
            <select name="gender" id="gender">
                <option value="select gender" disabled selected>select gender</option>
                <option value="Male">Male</option>
                <option value="female">female</option>
                <option value="other">other</option>

            </select>
            <br>
            <br>
            <label for="phone">phone number:</label>
            <input type="number" name="Phone number" id="phone" required placeholder="Enter your number">

        </form>
    </fieldset>
    <fieldset>
        <legend>Medical History</legend>
      <label for="Blood">Blood Group</label> 
        <select name="Blood Group" id="Blood">
            <option value="Select blood group" disabled selected>Select blood grpup</option>
            <option value="A">A</option>
            <option value="A+">A+</option>
            <option value="B+">B+</option>
            <option value="O">O</option>
            <option value="O+">O+</option>
            <option value="A-">A-</option>
            <option value="O-">O-</option>
        </select>
        <br>
        
        <p>Do you wear glasses or contect lenses?</p>
        <br>
        
        <input type="checkbox">
        <label for="yes">Yes:</label>
        <br>
        <input type="checkbox">
        <label for="No">No:</label>
        <br>
        <br>
        <label for="pre">Pre-existing Condition:</label>
        <textarea name="Pre-existing Condition" id="pre"></textarea>
        <br>
        <br>
        <label for="Allergics">Allergice:</label>
        <input type="checkbox" id="term" name="agree">
         <label for="term">Pollen</label>
         <br>
         <br>
         <input type="checkbox" name="peanuts" id="Pean">
         <label for="pean">Peanuts</label>
         <br>
         <br>
         <input type="checkbox" id="Lat" name="Latex">
         <label for="Lat">Latex</label>
         <br>
         <br>
         <input type="checkbox" id="Non" name="None">
         <label for="Non">Non</label>
         <br>
         <br><label for="Current">Current Medications:</label>
         <textarea name="Current Medications" id="Current"></textarea>
</fieldset>
<fieldset>
    <legend>Emergency Contect</legend>
    <label for="Contect">Emergency Contect Name:</label>
    <input type="text" name="Emergency" id="Conetct">
    <br>
    <br>
    <label for="phone">Emergency Contect Number:</label>
    <input type="text" name="Emergency Conetct" id="phone">
    <br>
    <br>
    <label for="Reletion"> Reletionship to Emergency Contect Number:</label>
    <input type="text" name="Emergency" id="Reletion">
    <br>
    <br>

</fieldset>
</body>
</html>
