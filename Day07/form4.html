<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Details Form</h1>
    <form>
        <label for="first">Full NAME:</label>
        <input type="text" name="Full NAME" id="first" required placeholder="Enter your name">
        <br>
        <br>
        <label for="second">Email:</label>
        <input type="email" id="second" required name="EMAIL ID" placeholder="Enter your Email">
        <br>
        <br>
        <label for="third">Phone number:</label>
        <input type="tel" id="third" required name="CONTECT" placeholder="Enter your phone number">
        <br>
        <br>
        <label for="gender">Gender:</label>
         <input type="radio" id="male" name="gender" value="male">
         <label for="male">male</label>
         <input type="radio" id="female" name="gender" value="female">
         <label for="female">female</label>
         <input type="radio" id="other" name="gender" value="other">
         <label for="other">other</label>
         <br>
         <br>
         <label for="forth">Job Title:</label>
         <input type="text" name="Job Title" id="forth" required placeholder="Enter your job title">
         <br>
         <br>
         <label for="dep">Department:</label>
         <select name="Department" id="dep">
            <option value="" disabled selected>select your Department</option>
            <option value="Eng">Eng.</option>
            <option value="civil eng.">civil eng.</option>
            <option value="camicale eng.">camicale eng.</option>
            <option value="cse eng.">cse eng.</option>
            <option value="bme eng.">bme eng.</option>
            <option value="textile eng.">textile eng.</option>
            <option value="EE eng.">EE eng.</option>
            <option value=""> Mech eng.</option>
            <option value="iT">iT</option>
            
                
            

         </select>
         <br>
         <br>
         <button>Submit</button>

    </form>
    
</body>
</html>
