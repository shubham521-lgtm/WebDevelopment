<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset>
        <legend>IIT JEE Ragistration Form</legend>
    <form action="">
        <label for="first">FULL NAME:</label>
        <input type="text" name="FUUL NAME" id="first" required placeholder="Enter your full name">
        <br>
        <br>
        <label for="second">Email:</label>
        <input type="email" name="Email" id="second" required placeholder="please Enter your Email">
        <br>
        <br>
        <label for="third">Phone number:</label>
        <input type="tel" id="third" required name="CONTECT" placeholder="Enter your phone number">
        <br>
        <br>
        <label for="pass">password:</label>
         <input type="password" name="" id="pass" required name="password" placeholder="please enter your password">
         <br>
         <br>
         <label for="Gender">Gender</label>
         <input type="radio" name="gender" id="male" value="male">
         <label for="male">Male</label>
         <input type="radio" name="gender" id="female" value="female">
         <label for="female">Female</label>
         <input type="radio" name="gender" id="other" value="other">
         <label for="Other">Other</label>
         <br>
         <br>
         <label for="Date">Date Of Birth:</label>
         <input type="date" name="Date Of Birth" id="Date" required min="2001-01-01" max="2005-08-30">
         <br>
         <br>
         <label for="School">SCHOOL NAME:</label>
         <input type="text" name="School name" id="School" required placeholder="please Enter your schol name">
         <br>
         <br>
         <label for="Bord">BOARD:</label>
         <select name="BOARD" id="Board">
            <option value="" disabled selected>select your board</option>
            <option value="MP Board">MP Board</option>
            <option value="UP BOARD">UP BOARD</option>
            <option value="HR Board">HR Board</option>
            <option value="CBSE Board">CBSE Board</option>
         </select>
         <br>
         <br>
         <label for="year">Passing of Year:</label>
         <input type="number" name="Passing of Year"  min="2022" max="2025" id="year" required>
         <br>
         <br>
         <label for="Center">Exam-Center</label>
         <select name="Exam-Center" id="Center">
            <option value="" disabled selected>Select Center</option>
            <option value="Indore">Indore</option>
            <option value="ujjain">ujjain</option>
            <option value="bhopal">bhopal</option>
            <option value="jaipur">jaipur</option>
            <option value="khandwa">khandwa</option>
            <option value="khargon">khargon</option>

         </select>
         <br>
         <br>
         <button>Register</button>

         





    </form> </fieldset>
    <!-- action ka kaam from ko kisi URL me open karne ka hota he -->
</body>
</html>
